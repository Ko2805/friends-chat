services:
  db:
    image: postgres:16.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nn_chat
      TZ: "Asia/Tokyo"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nn_chat"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ../nn-chat-db:/var/lib/postgresql/data

  app:
    build: .
    tty: true
    ports:
      - 8080:8080
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      
volumes:
  node_modules: